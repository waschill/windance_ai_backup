  SAM:
    platform: Raspberry Pi 5 / Raspberry Pi OS
    ip: 192.168.36.29
    network: Wi-Fi only; no wired LAN connection
    former_wired_ip: 192.168.36.230 (not active while SAM is Wi-Fi-only)
    role: Scheduling server node and 9x16 touch display for daily barn schedule
    services:
      - Windance schedule display kiosk
      - Training/Farrier/Vet completion capture
      - Archivist commit client
    access:
      ssh: SAM-WIFI
      ssh_legacy_wired: SAM (not currently reachable)
      user: williamschilling
      auth: dedicated homelab SSH key
    hardware:
      storage: 128GB microSD card mounted as root filesystem; the former 1TB NVMe was intentionally removed to reduce heat
      display: planned portrait 9x16 touch screen
    notes:
      storage_status: Verified 2026-08-15 booted normally from the microSD card with approximately 119GB available device capacity; absence of the NVMe is intentional and is not a fault
      remote_access_status: SSH via SAM-WIFI is the supported administration path; Raspberry Pi Connect/WayVNC is optional and not required for Windance operations
      setup_status: SSH key access from HAL and HERALD configured and verified 2026-07-17
      codex_approval_policy: William granted standing operational authorization on 2026-07-18 for Codex/Vega to use SAM SSH and make requested SAM changes without extra per-node approval; still verify after changes and avoid unrelated risky work
      os: Raspberry Pi OS / Debian, aarch64
      python: Python 3.13 available
      browser: Chromium available for kiosk mode
      sudo_status: sudo -n true succeeds for williamschilling
      schedule_app_status: Working v1 installed 2026-07-17 as systemd service sam-schedule.service, bound to 0.0.0.0:8088
      schedule_app_urls: http://192.168.36.29:8088 over Wi-Fi; admin page at /admin
      schedule_app_path: /home/williamschilling/services/sam-schedule/sam_schedule.py
      committed_history: As of 2026-08-01, committed daily Training/Farrier/Vet rows remain in SAM SQLite and are available read-only to Herald through SAM /api/history. Herald recognizes date-ranged historical questions such as “farrier work this week” and “Kiowa’s training for the last week in July.”
      schedule_app_assets: /home/williamschilling/services/sam-schedule/assets includes horse.png title ornament copied from P:/Business/Windance Farms/Branding/HORSE.png
      schedule_app_database: /home/williamschilling/.local/share/sam-schedule/sam_schedule.db
      schedule_app_kiosk: As of 2026-07-21, verified boot-to-kiosk path uses LightDM autologin to rpd-labwc and Labwc user autostart /home/williamschilling/.config/labwc/autostart to launch /home/williamschilling/bin/sam-schedule-kiosk.sh. The launcher waits for http://127.0.0.1:8088/ and opens Chromium in Wayland kiosk mode with dedicated profile /home/williamschilling/.config/chromium-sam-kiosk. Chromium launches with --password-store=basic so desktop keyring auth does not block unattended kiosk startup. Logs are in /home/williamschilling/logs/sam-kiosk/kiosk.log. Old XDG .desktop autostart was moved under /home/williamschilling/.config/autostart/disabled/ to prevent duplicate launches. Reboot verification passed 2026-07-21.
      schedule_app_tests: Health, wired URL, WiFi URL, Herald/Odoo update, cell complete/undo, manual commit to Archivist memory, trainer admin save/disable, guarded Odoo write dry-run, unfinished-training rollover dry-run, and smaller-screen vertical scrolling tested 2026-07-18
      schedule_app_scope: local portrait touch UI showing Horse, Training, Farrier, and Vet columns; Training displays the raw Odoo schedule code exactly as entered rather than a decoded label; page uses full screen width with large touch-friendly rows and vertical scrolling on smaller/landscape screens; schedule tables remain opaque white for readability while surrounding page/header uses Windance.farm-inspired royal blue background, white text, purple accent styling, mirrored horse title ornaments, and mm/dd/yyyy display date; Training cells are color-coded by trainer (Shawn blue, William purple, Skye red, Teaghan green, Lynda teal); Update preserves Odoo blank schedule rows so Shawn's visual spacing is retained; Update refreshes live schedule from Herald/Odoo; Commit sends completed cells back to Archivist for dated memory/history; Training/Farrier/Vet cells grey out when tapped; trainer dropdown filters horses by trainer; bottom weather-alert strip displays only when SAM's cached NWS alert check finds a relevant active severe/weather alert for the Custer, SD point
      schedule_app_odoo_proxy_note: Herald /odoo/search cap raised from 50 to 1000 and now supports offset/order on 2026-07-17 because SAM's full schedule exceeded 50 rows; SAM preserves returned Odoo row order for display rather than relying only on x_studio_sequence
      schedule_app_architecture: Web app hosted on SAM so it can run locally in Chromium kiosk mode on the barn display and also be reached remotely by William for viewing/adjustments. Admin page remains available only by manually opening /admin; the visible Admin button is removed from the schedule page. Admin page supports adding, editing, disabling, and real deletion of trainers used by the schedule filter/dropdown.
      schedule_sync_policy: SAM initiates schedule data flow. SAM automatically requests the new daily schedule from Herald/Odoo at 5:00 AM local time. Update button manually pulls latest schedule from Herald/Odoo. Commit button pushes completed Training/Farrier/Vet state back to Archivist. During commit, unfinished training with an Odoo schedule row is recorded in SAM's missed_training ledger and rolled to the next day's Odoo schedule cell only if tomorrow's cell is blank; same-code existing values are treated as already present; different existing values are recorded as conflicts and are not overwritten. Odoo stores only the plain training code; SAM locally renders carried missed training with a yellow/gold standout warning chip on the target day. If the target day already has a different scheduled training code, SAM displays a split Training cell with the normal trainer-colored chip plus the yellow/gold carried-missed chip instead of overwriting Odoo. As of 2026-07-21, split Training cells render those chips side-by-side as equal-width touch targets and only wrap for three or more chips. Carried-missed chips can be marked complete independently. If the day has not been committed, SAM automatically commits at 11:55 PM local time.
      schedule_daily_reliability: As of 2026-07-27, the 5:00 AM systemd refresh timer was manually executed and verified to fetch 56 current Odoo rows successfully. The kiosk now reloads the live schedule every 60 seconds and when it becomes visible, fixing the stale-date behavior caused by a Chromium page remaining open while the display slept. A separate persistent systemd timer sam-schedule-nightly.timer provides an independent 11:55 PM commit recovery path; it commits only the just-ended day if SAM was offline, never a historical backlog. The primary in-process commit is idempotent, so the two paths cannot create a duplicate memory/history commit.
      schedule_reports: SAM exposes /api/reports/missed-training?month=YYYY-MM for month-end missed-training reports grouped by trainer using commit-time missed_training records.
      schedule_cell_toggle_policy: Training/Farrier/Vet cells track completion independently. First tap marks the cell complete and greys it out. Tapping a completed cell again uses a centered touch-friendly in-page confirmation dialog before undoing completion.
      schedule_weather_alerts: As of 2026-07-21, SAM polls https://api.weather.gov/alerts/active for point 43.7667,-103.5988 every 5 minutes by default, using SAM_WEATHER_ALERT_LAT/LON and SAM_WEATHER_ALERT_POLL_SECONDS as overrides. Results are cached in SQLite table weather_alert_state and exposed at /api/weather-alerts; the schedule page polls SAM locally once per minute and displays a compact red alert strip for relevant thunderstorm, tornado, high wind, hail, winter storm/blizzard, flood, red flag/fire weather, severe, extreme, or moderate-plus urgent alerts.
      schedule_training_code_parser: Training schedule Odoo cell codes use first letter as trainer except single F; S=Shawn, K=Skye, W=William, L=Lynda, T=Teaghan. Work codes include F=Freewalk, R=Ride, G=Ground Work, D=Drive, Bit=Bit, L=Lunge, T=Trailride. Example KLBit means Skye should Lunge and Bit the horse. Parser also supports legacy activity+trainer codes such as RK, RS, TK, and LS while current Odoo data is migrated.
      schedule_farrier_vet_source: Farrier/Vet needs come from the Odoo Horses model. Vet flag field x_studio_needs_vet; vet detail field x_studio_vet_needs. Farrier flag field x_studio_needs_farrier; farrier detail field x_studio_farrier_needs.

